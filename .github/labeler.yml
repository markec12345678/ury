# URY Dashboard — PR Auto-label Configuration
# Maps file paths to labels for automatic PR categorization

# UI component library
packages/ui:
  - changed-files:
      - any-glob-to-any-file: "packages/ui/**"

# Core utilities
packages/core:
  - changed-files:
      - any-glob-to-any-file: "packages/core/**"

# POS v2 application
pos:
  - changed-files:
      - any-glob-to-any-file: "pos/**"

# Legacy POS
urypos:
  - changed-files:
      - any-glob-to-any-file: "urypos/**"

# Backend (Frappe)
backend:
  - changed-files:
      - any-glob-to-any-file: "ury/**"

# Kitchen Display System
mosaic:
  - changed-files:
      - any-glob-to-any-file: "URYMosaic/**"

# Infrastructure & CI/CD
infra:
  - changed-files:
      - any-glob-to-any-file: ".github/**"
      - any-glob-to-any-file: "Dockerfile*"
      - any-glob-to-any-file: "docker-compose*.yml"
      - any-glob-to-any-file: "scripts/**"
      - any-glob-to-any-file: "Makefile"

# Storybook
storybook:
  - changed-files:
      - any-glob-to-any-file: ".storybook/**"
      - any-glob-to-any-file: "packages/ui/src/components/__stories__/**"

# Dependencies
dependencies:
  - changed-files:
      - any-glob-to-any-file: "package.json"
      - any-glob-to-any-file: "packages/*/package.json"
      - any-glob-to-any-file: "pos/package.json"
      - any-glob-to-any-file: "package-lock.json"

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file: "*.md"

# Docker
docker:
  - changed-files:
      - any-glob-to-any-file: "Dockerfile*"
      - any-glob-to-any-file: "docker-compose*.yml"
      - any-glob-to-any-file: ".devcontainer/**"

# Security
security:
  - changed-files:
      - any-glob-to-any-file: "SECURITY.md"
