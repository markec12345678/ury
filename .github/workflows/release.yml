# URY — Release Workflow
# Creates a release when a tag is pushed (e.g. v0.3.0, v1.0.0-beta)
# Steps: validate build, generate changelog, create GitHub release, optionally push Docker image

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ── Validate Build ──────────────────────────────────────────
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Build Storybook (UI components)
        run: yarn build-storybook

      - name: Build packages/ui
        run: yarn --cwd packages/ui build || true

      - name: Build packages/core
        run: yarn --cwd packages/core build || true

      - name: Build POS v2
        run: yarn --cwd pos build
        continue-on-error: true

      - name: Build frontend
        run: yarn --cwd frontend build
        continue-on-error: true

  # ── Create GitHub Release ─────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -50)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges ${PREV_TAG}..HEAD)
          fi

          # Categorize commits
          FEATURES=$(echo "$COMMITS" | grep -iE "^[[:space:]]*- (feat|feature)" || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^[[:space:]]*- fix" || true)
          DOCS=$(echo "$COMMITS" | grep -iE "^[[:space:]]*- docs" || true)
          REFACTOR=$(echo "$COMMITS" | grep -iE "^[[:space:]]*- refactor" || true)
          CI=$(echo "$COMMITS" | grep -iE "^[[:space:]]*- (ci|chore)" || true)
          OTHER=$(echo "$COMMITS" | grep -viE "^[[:space:]]*- (feat|feature|fix|docs|refactor|ci|chore)" || true)

          {
            echo "features<<EOF"
            echo "$FEATURES"
            echo "EOF"
            echo "fixes<<EOF"
            echo "$FIXES"
            echo "EOF"
            echo "docs<<EOF"
            echo "$DOCS"
            echo "EOF"
            echo "refactor<<EOF"
            echo "$REFACTOR"
            echo "EOF"
            echo "ci<<EOF"
            echo "$CI"
            echo "EOF"
            echo "other<<EOF"
            echo "$OTHER"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace('v', '');
            const isPrerelease = tag.includes('-');
            const features = `${{ steps.changelog.outputs.features }}`.trim();
            const fixes = `${{ steps.changelog.outputs.fixes }}`.trim();
            const docs = `${{ steps.changelog.outputs.docs }}`.trim();
            const refactor = `${{ steps.changelog.outputs.refactor }}`.trim();
            const ci = `${{ steps.changelog.outputs.ci }}`.trim();
            const other = `${{ steps.changelog.outputs.other }}`.trim();

            let body = `## URY ${version}\n\n`;

            if (isPrerelease) {
              body += `> **Note:** This is a pre-release version.\n\n`;
            }

            if (features) {
              body += `### Features\n${features}\n\n`;
            }
            if (fixes) {
              body += `### Bug Fixes\n${fixes}\n\n`;
            }
            if (refactor) {
              body += `### Refactoring\n${refactor}\n\n`;
            }
            if (docs) {
              body += `### Documentation\n${docs}\n\n`;
            }
            if (ci) {
              body += `### CI/CD & Maintenance\n${ci}\n\n`;
            }
            if (other) {
              body += `### Other Changes\n${other}\n\n`;
            }

            body += `### Docker\n\`\`\`bash\ndocker pull ghcr.io/${context.repo.owner}/${context.repo.repo}:${version}\ndocker pull ghcr.io/${context.repo.owner}/${context.repo.repo}:latest\n\`\`\`\n`;

            const { data: release } = await github.rest.releases.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `URY ${version}`,
              body: body,
              draft: false,
              prerelease: isPrerelease
            });

            console.log(`Release created: ${release.html_url}`);

  # ── Build & Push Docker Image ────────────────────────────
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
