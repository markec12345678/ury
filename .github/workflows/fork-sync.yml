# URY — Fork Sync Workflow
# Keeps the fork up-to-date with upstream and provides manual PR creation.
#
# Jobs:
#   sync-upstream: Weekly (or manual) merge of upstream/develop into fork/develop
#   create-upstream-pr: Manual trigger to create PR from fork to upstream

name: Fork Sync

on:
  # Weekly sync from upstream (Monday at 07:00 UTC)
  schedule:
    - cron: "0 7 * * 1"
  # Manual triggers
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'sync-upstream'
        type: choice
        options:
          - sync-upstream
          - create-upstream-pr
      source_branch:
        description: 'Source branch (for create-upstream-pr)'
        required: false
        default: 'develop'
      target_branch:
        description: 'Target branch on upstream (for create-upstream-pr)'
        required: false
        default: 'develop'

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── Sync Upstream to Fork ────────────────────────────────
  sync-upstream:
    name: Sync Upstream to Fork
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'sync-upstream')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          UPSTREAM_REPO="${{ secrets.UPSTREAM_REPO || 'ury-erp/ury' }}"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          CURRENT_BRANCH=$(git branch --show-current)
          UPSTREAM_BRANCH="develop"
          BEHIND=$(git rev-list --count HEAD..upstream/$UPSTREAM_BRANCH 2>/dev/null || echo "0")
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "branch=$CURRENT_BRANCH" >> $GITHUB_OUTPUT

          if [ "$BEHIND" -eq 0 ]; then
            echo "Fork is already up to date with upstream/$UPSTREAM_BRANCH"
          else
            echo "Fork is $BEHIND commits behind upstream/$UPSTREAM_BRANCH"
          fi

      - name: Sync fork with upstream
        if: steps.check.outputs.behind != '0'
        run: |
          UPSTREAM_BRANCH="develop"
          echo "Merging upstream/$UPSTREAM_BRANCH into ${{ steps.check.outputs.branch }}..."
          git merge upstream/$UPSTREAM_BRANCH --no-edit || {
            echo "::warning::Merge conflicts detected. Creating a sync branch instead."
            git merge --abort
            SYNC_BRANCH="sync/upstream-$(date +%Y%m%d)"
            git checkout -b "$SYNC_BRANCH"
            git merge upstream/$UPSTREAM_BRANCH --no-edit
            git push origin "$SYNC_BRANCH"
            echo "Created sync branch: $SYNC_BRANCH — resolve conflicts and merge manually."
            exit 0
          }
          git push origin ${{ steps.check.outputs.branch }}
          echo "Successfully synced with upstream"

      - name: Summary
        if: always()
        run: |
          echo "## Upstream Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "- Commits behind: ${{ steps.check.outputs.behind }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ steps.check.outputs.branch }}" >> $GITHUB_STEP_SUMMARY

  # ── Create PR from Fork to Upstream ──────────────────────
  create-upstream-pr:
    name: Create Upstream PR
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' && inputs.action == 'create-upstream-pr'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine branches
        id: branches
        run: |
          echo "source=${{ inputs.source_branch || 'develop' }}" >> $GITHUB_OUTPUT
          echo "target=${{ inputs.target_branch || 'develop' }}" >> $GITHUB_OUTPUT

      - name: Get recent commits for PR body
        id: commits
        run: |
          SOURCE="${{ steps.branches.outputs.source }}"
          MESSAGES=$(git log --oneline -15 origin/$SOURCE 2>/dev/null || git log --oneline -15 $SOURCE)
          echo "messages<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Pull Request to Upstream
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.UPSTREAM_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const sourceBranch = '${{ steps.branches.outputs.source }}';
            const targetBranch = '${{ steps.branches.outputs.target }}';
            const forkRepo = '${{ github.repository }}';
            const upstreamRepo = '${{ secrets.UPSTREAM_REPO || 'ury-erp/ury' }}';
            const commitMessages = `${{ steps.commits.outputs.messages }}`;

            const title = `Sync: ${forkRepo}:${sourceBranch} → ${targetBranch}`;
            const body = `## Automated Fork Sync

            **Source:** \`${forkRepo}:${sourceBranch}\`
            **Target:** \`${upstreamRepo}:${targetBranch}\`

            ### Recent Commits
            ${commitMessages.split('\n').map(m => `- ${m}`).join('\n')}

            ---
            This PR was automatically created by the Fork Sync workflow.
            Please review the changes before merging.`;

            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: upstreamRepo.split('/')[0],
                repo: upstreamRepo.split('/')[1],
                title: title,
                body: body,
                head: `${forkRepo}:${sourceBranch}`,
                base: targetBranch,
              });
              console.log(`Created PR #${pr.number}: ${pr.html_url}`);
            } catch (error) {
              if (error.status === 422) {
                console.log('A PR already exists for this branch combination.');
              } else {
                throw error;
              }
            }
