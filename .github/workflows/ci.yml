# URY — Main CI Pipeline
# Runs on every push and PR to main/develop branches
# Steps: lint, type-check, unit tests, security audit, build verification, E2E

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # ── Lint & Type Check ─────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Run ESLint
        run: yarn lint

      - name: TypeScript type check (UI package)
        run: yarn --cwd packages/ui typecheck

      - name: TypeScript type check (Core package)
        run: yarn --cwd packages/core typecheck

  # ── Security Audit ────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node
        with:
          install-deps: 'false'

      - name: Yarn audit (high + critical)
        run: |
          echo "## Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          AUDIT_OUTPUT=$(yarn npm audit --severity high 2>&1 || true)
          if echo "$AUDIT_OUTPUT" | grep -q "No vulnerabilities"; then
            echo "✅ No high or critical vulnerabilities found." >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Vulnerabilities detected:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$AUDIT_OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Dependency review (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          deny-licenses: GPL-2.0, AGPL-1.0

  # ── Unit Tests ────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Run Vitest
        run: yarn test --coverage --reporter=json --outputFile=test-results.json
        env:
          NODE_ENV: test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Test summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const results = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
              const summary = `**Test Results:** ${results.numPassedTests || 'N/A'} passed, ${results.numFailedTests || 'N/A'} failed, ${results.numTotalTests || 'N/A'} total`;
              core.summary.addRaw(summary).write();
            } catch (e) {
              core.summary.addRaw('No test results file found (tests may not be configured yet)').write();
            }

  # ── Build Verification ────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Build all workspaces
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Verify build outputs
        run: |
          echo "## Build Output Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ -d "storybook-static" ]; then
            echo "| Storybook | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Storybook | ⏭️ Not built |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d "pos/dist" ]; then
            echo "| POS v2 | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| POS v2 | ⏭️ Skipped (needs Frappe) |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d "frontend/dist" ]; then
            echo "| Frontend | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Frontend | ⏭️ Skipped (needs config) |" >> $GITHUB_STEP_SUMMARY
          fi

  # ── E2E Tests (only on PRs to main) ──────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: yarn test:e2e || echo "E2E tests not configured yet"
        env:
          NODE_ENV: test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── CI Summary ────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, security, test, build, e2e]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | \`${{ needs.lint.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | \`${{ needs.security.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | \`${{ needs.test.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Verification | \`${{ needs.build.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | \`${{ needs.e2e.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          FAILED=0
          for r in "${{ needs.lint.result }}" "${{ needs.security.result }}" "${{ needs.test.result }}" "${{ needs.build.result }}"; do
            if [ "$r" = "failure" ]; then FAILED=1; fi
          done
          if [ "$FAILED" = "1" ]; then
            echo "⚠️ **Pipeline has failures.** Review individual job logs." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All pipeline checks passed.**" >> $GITHUB_STEP_SUMMARY
          fi
