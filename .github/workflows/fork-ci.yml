# URY — Fork CI Pipeline
# Runs CI checks on the fork repository, bypassing the upstream approval requirement.
# This allows contributors to validate their changes before the upstream admin approves.
#
# Triggers on push to feature branches and PRs within the fork.

name: Fork CI

on:
  push:
    branches: [develop, 'feature/**', 'infra/**', 'fix/**']
  pull_request:
    branches: [develop]

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Lint & Type Check ─────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    if: github.repository != 'ury-erp/ury'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Run ESLint
        run: yarn lint

      - name: TypeScript type check (UI package)
        run: yarn --cwd packages/ui typecheck

  # ── Storybook Build ───────────────────────────────────────
  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    needs: lint
    if: github.repository != 'ury-erp/ury'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Build Storybook
        run: yarn build-storybook

      - name: Upload Storybook artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 5

  # ── Build Verification ────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint
    if: github.repository != 'ury-erp/ury'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node

      - name: Build all workspaces
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # ── Report Status ─────────────────────────────────────────
  report:
    name: CI Status Report
    runs-on: ubuntu-latest
    needs: [lint, storybook, build]
    if: always() && github.repository != 'ury-erp/ury'
    steps:
      - name: Summary
        run: |
          echo "## Fork CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | \`${{ needs.lint.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Storybook Build | \`${{ needs.storybook.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Verification | \`${{ needs.build.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.lint.result }}" = "failure" ] || [ "${{ needs.storybook.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "failure" ]; then
            echo "⚠️ **One or more checks failed.** Please review the logs above." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All checks passed.**" >> $GITHUB_STEP_SUMMARY
          fi
