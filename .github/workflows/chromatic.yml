# URY Dashboard — Storybook Chromatic Publish
# Publishes Storybook to Chromatic for visual regression testing
# Runs on PRs to main/develop and on pushes to main

name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  chromatic:
    name: Visual Tests (Chromatic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Chromatic needs full history for baselines

      - uses: ./.github/actions/setup-node

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitOnceUploaded: true
          onlyChanged: true  # Only test stories affected by the changes
