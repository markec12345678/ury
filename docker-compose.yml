# URY Dashboard — Docker Compose Configuration
# Production-ready setup with Frappe backend connection

services:
  # ── URY Dashboard ───────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ury-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-this-in-production}
      - NEXT_PUBLIC_FRAPPE_URL=${FRAPPE_URL:-http://frappe:8000}
      - NEXT_PUBLIC_REFRESH_INTERVAL=${REFRESH_INTERVAL:-30000}
      - NEXT_PUBLIC_RESTAURANT_NAME=${RESTAURANT_NAME:-URY Restaurant}
      - NEXT_PUBLIC_CURRENCY=${CURRENCY:-₹}
    networks:
      - ury-network
    depends_on:
      frappe:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frappe/ERPNext Backend (optional) ──────────────────
  # Uncomment if you want to run Frappe alongside the dashboard
  # For production, use a separate Frappe deployment
  #
  # frappe:
  #   image: frappe/erpnext:v15
  #   container_name: ury-frappe
  #   restart: unless-stopped
  #   ports:
  #     - "${FRAPPE_PORT:-8000}:8000"
  #     - "${FRAPPE_SOCKET_PORT:-9000}:9000"
  #   environment:
  #     - FRAPPE_SITE_NAME=${FRAPPE_SITE_NAME:-ury}
  #   volumes:
  #     - frappe-sites:/home/frappe/frappe-bench/sites
  #     - frappe-logs:/home/frappe/frappe-bench/logs
  #   networks:
  #     - ury-network

networks:
  ury-network:
    driver: bridge

